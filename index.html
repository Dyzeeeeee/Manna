<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Daily bread, accounted for." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EFE6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E1A17" />

    <!-- Applied before React mounts, from the same localStorage key store.ts's
         useTheme reads — otherwise a named theme (Shark, Penguin) would paint
         the default palette first and then jump, the exact flash the system
         dark mode below never has because the browser applies it at CSS-parse
         time with no JS in the loop. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("manna:theme");
          if (t === "shark" || t === "penguin") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- Android reads display/standalone from the manifest; iOS historically
         needed these, and still uses them for the home-screen label and the
         status bar. Without apple-mobile-web-app-capable an older iPhone opens
         the app in a Safari-ish view with browser chrome instead of standalone,
         which defeats the point of installing it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manna" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/svg+xml" href="/icons/mark.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Manna</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/main.tsx"></script>
  </body>
</html>
